spring.application.name=backend

# Variabili locali da .env (formato KEY=valore), opzionale: se manca valgono i default sotto.
# Il secondo percorso serve quando IntelliJ avvia l'app dalla cartella del progetto invece che da backend/
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salone}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Amministratore creato all'avvio se non esiste. Nessuna password di default: senza ADMIN_PASSWORD non viene creato
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# JWT firmato HS256: il secret deve essere >= 32 byte
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# Indirizzo del frontend, usato per il link di disattivazione nella mail
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Gmail: MAIL_PASSWORD e' una "password per le app" di Google, mai la password dell'account.
# Con MAIL_ENABLED=false la mail non parte e nel log resta solo l'id dell'avviso (utile per provare senza Gmail)
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:noreply@salone.local}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.data.web.pageable.max-page-size=100

server.port=${PORT:8080}
